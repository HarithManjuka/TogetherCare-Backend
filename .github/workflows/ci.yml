name: TogetherCare Backend CI

on:
  push:
    branches: [ dev, main, "feature/**" ]
  pull_request:
    branches: [ dev, main ]

jobs:
  backend-quality-checks:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci_test_secret_key_1234567890
      PORT: 5001

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OpenSSL 1.1 (for MongoDB Memory Server)
        run: |
          wget http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb || sudo apt-get install -f -y

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Integration Tests
        run: npm test
